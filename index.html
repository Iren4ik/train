<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: pink-lilac hero → sticky pill tabs → 1–2 column grid of white cards; each card = thin day-style number, blue title, pale-blue chips, two pink-studio illustration panels, steps, tip with lime label */
:root{
  --bg:#FAF7FD; --card:#FFFFFF; --soft:#EEF2FD; --fg:#1F2342; --muted:#6C7193; --line:#E5E8F5; --glass:rgba(255,255,255,.66);
  --blue:#2F6BEA; --blueink:#2558CC; --onblue:#FFFFFF;
  --lime:#E4F39B; --limeink:#3A4310;
  --hero1:#F6D2EE; --hero2:#E6D7FB; --hero3:#FCEBE6;
  --pan1:#F7E0F2; --pan2:#E9E3FB;
  --fig:#1F2342; --fig2:#B8B3D3; --eq:#D2CDE6; --eqd:#8D89AF; --mat:#E4D2EE; --acc:#2F6BEA;
  --shadow:0 2px 6px rgba(47,60,140,.05),0 12px 30px rgba(47,60,140,.08);
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1022; --card:#171A31; --soft:#20264A; --fg:#ECEEFA; --muted:#A0A5C6; --line:#282C4A; --glass:rgba(14,16,34,.45);
  --blue:#82A5FF; --blueink:#AFC4FF; --onblue:#0E1022;
  --lime:#CADB6E; --limeink:#1B210A;
  --hero1:#46264F; --hero2:#2B2A5C; --hero3:#3B2434;
  --pan1:#27213D; --pan2:#1F2342;
  --fig:#ECEEFA; --fig2:#5E6189; --eq:#3A3E63; --eqd:#7F84AB; --mat:#2D2C4B; --acc:#82A5FF;
  --shadow:0 2px 6px rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1022; --card:#171A31; --soft:#20264A; --fg:#ECEEFA; --muted:#A0A5C6; --line:#282C4A; --glass:rgba(14,16,34,.45);
  --blue:#82A5FF; --blueink:#AFC4FF; --onblue:#0E1022;
  --lime:#CADB6E; --limeink:#1B210A;
  --hero1:#46264F; --hero2:#2B2A5C; --hero3:#3B2434;
  --pan1:#27213D; --pan2:#1F2342;
  --fig:#ECEEFA; --fig2:#5E6189; --eq:#3A3E63; --eqd:#7F84AB; --mat:#2D2C4B; --acc:#82A5FF;
  --shadow:0 2px 6px rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.wrap{padding-block:16px 4px}
.hero{border-radius:30px;padding:clamp(22px,4.5vw,44px);display:grid;gap:16px;position:relative;overflow:hidden;
  background:linear-gradient(165deg,var(--hero1) 0%,var(--hero2) 58%,var(--hero3) 100%)}
@media (max-width:760px){.hero::after{display:none}}
.hero::after{content:"сила";position:absolute;right:-.04em;top:-.2em;font-weight:700;font-size:clamp(90px,17vw,190px);line-height:1;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px var(--glass);pointer-events:none}
.hero>*{position:relative;z-index:1}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
h1{font-weight:700;font-size:clamp(34px,7vw,62px);line-height:1;letter-spacing:-.035em;margin:0;color:var(--blue);text-wrap:balance}
.lead{margin:0;max-width:54ch;font-size:15.5px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--glass);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--blueink);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:20px;height:7px;border-radius:4px;display:inline-block}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.tabrow{display:flex;gap:8px;padding-block:12px;overflow-x:auto;scrollbar-width:none}
.tab{font:inherit;cursor:pointer;border:0;background:var(--card);color:var(--blue);border-radius:999px;padding:10px 18px;display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap;box-shadow:var(--shadow);transition:background .2s,color .2s}
.tab b{font-weight:700;font-size:15px}
.tab small{color:var(--muted);font-size:12.5px;font-weight:500}
.tab[aria-selected="true"]{background:var(--blue);color:var(--onblue)}
.tab[aria-selected="true"] small{color:var(--onblue);opacity:.8}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main.wrap{padding-block:12px 56px}
.intro{display:grid;gap:6px;margin-bottom:20px}
.intro .eyebrow{color:var(--muted)}
.intro h2{font-weight:700;font-size:clamp(26px,4vw,36px);letter-spacing:-.03em;line-height:1.05;margin:0;color:var(--blue)}
.intro p{margin:0;color:var(--muted);max-width:68ch}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:780px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;gap:14px;align-content:start;min-width:0;box-shadow:var(--shadow)}
.chead{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.num{display:grid;justify-items:center;color:var(--blue);line-height:1;min-width:30px}
.num b{font-weight:300;font-size:32px;font-variant-numeric:tabular-nums}
.num small{font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.chead h3{margin:2px 0 0;font-size:18px;line-height:1.22;font-weight:700;letter-spacing:-.015em;color:var(--blue);text-wrap:balance}
.en{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.dose{font-size:13px;font-weight:600;white-space:nowrap;padding:7px 12px;border-radius:999px;background:var(--soft);color:var(--blueink);font-variant-numeric:tabular-nums}
.frames{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.frames.one{grid-template-columns:minmax(0,60%);justify-content:center}
figure{margin:0;display:grid;gap:6px;min-width:0}
figure svg{width:100%;height:auto;display:block;background:linear-gradient(170deg,var(--pan1),var(--pan2));border-radius:18px}
figcaption{font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.arr{color:var(--blue);font-size:18px;padding-bottom:22px}
.how{margin:0;padding-left:20px;display:grid;gap:5px}
.how li::marker{color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums}
.tip{margin:0;font-size:14px;padding:12px 14px;border-radius:16px;background:var(--soft)}
.tip b{display:inline-block;background:var(--lime);color:var(--limeink);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-right:6px;vertical-align:1px}
.foot{color:var(--muted);font-size:13px;margin-top:24px;max-width:70ch}
.mus{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12.5px;line-height:1.2;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-style:normal;white-space:nowrap}
.chip.main{background:var(--soft);border-color:transparent;color:var(--blueink);font-weight:600}
.legend .chip{padding:2px 9px;font-size:12px;background:var(--glass);border-color:transparent}
.legend .chip.main{background:var(--soft)}
.lvl{color:var(--blue);font-weight:600;letter-spacing:.04em;white-space:nowrap}
.pickbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
#pcount{font-weight:700;margin-right:4px;color:var(--blue)}
.pbtn{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--blue);background:transparent;color:var(--blue);border-radius:999px;padding:7px 14px}
.pbtn[aria-pressed="true"]{background:var(--blue);color:var(--onblue)}
.pick{justify-self:center;font:inherit;font-weight:600;font-size:14px;cursor:pointer;border:1.5px solid var(--blue);color:var(--blue);background:transparent;border-radius:999px;padding:10px 26px;transition:transform .15s}
.pick:active{transform:scale(.97)}
.pick[aria-pressed="true"]{background:var(--blue);color:var(--onblue)}
.pick:focus-visible,.pbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card.picked{outline:2px solid var(--blue);outline-offset:-1px}
.empty{color:var(--muted);padding:24px 0}
@media (prefers-reduced-motion:reduce){.tab,.pick{transition:none}}
/* svg */
.lb{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig{stroke:var(--fig)} .fig2{stroke:var(--fig2)}
.torsoF{fill:var(--fig)}
.head{fill:var(--fig)}
.floor{stroke:var(--eq);stroke-width:1.5}
.eq{fill:var(--eq)} .eqd{fill:var(--eqd)} .mat{fill:var(--mat)} .wall{fill:var(--mat)}
.cb{stroke:var(--eqd);stroke-width:1.4} .dash{stroke-dasharray:3 3}
.bar{stroke:var(--eqd);stroke-width:3.5;stroke-linecap:round}
.post{stroke:var(--eqd);stroke-width:4;stroke-linecap:round}
.pad{stroke:var(--eq);stroke-width:8;stroke-linecap:round}
.plat{stroke:var(--eqd);stroke-width:6;stroke-linecap:round}
.wt{fill:var(--acc)} .plate{fill:var(--acc);fill-opacity:.9} .hub{fill:var(--card)}
.hl{fill:var(--acc);fill-opacity:.22;stroke:var(--acc);stroke-width:1.5}
.lbl{fill:var(--muted);font-size:10px;font-family:var(--font)}
</style>

<header class="wrap">
  <div class="hero">
    <span class="eyebrow">Мой план тренировок</span>
    <h1>Атлас упражнений</h1>
    <p class="lead">Схемы ко всем тренировкам: слева исходное положение, справа конечное. Мелким шрифтом — как упражнение обычно называют в зале.</p>
    <div class="stats" id="stats"></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--fig)"></i>ближние рука и нога</span>
      <span><i class="sw" style="background:var(--fig2)"></i>дальние рука и нога</span>
      <span><i class="sw" style="background:var(--acc)"></i>вес</span>
      <span><i class="sw" style="background:var(--eqd)"></i>тренажёр, скамья</span>
      <span><i class="chip main">мышцы</i>основная нагрузка</span>
      <span><i class="chip">мышцы</i>помогают</span>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Тренировки"><div class="wrap tabrow" role="tablist" id="tabs"></div></nav>
<main class="wrap" id="main"></main>

<script>
const FLOOR=150, W=220, VBY=-22, VBH=184;
const L={torso:42,neck:13,ua:24,fa:22,th:31,sh:29,foot:8};
const R={h:8.5,n:7.5,p:7.5,s1:7.5,s2:7.5,hp1:7.5,hp2:7.5,t1:2.5,t2:2.5};
const RAD=Math.PI/180;
const go=(o,a,l)=>[o[0]+Math.cos(a*RAD)*l,o[1]+Math.sin(a*RAD)*l];
const fx=v=>Math.round(v*10)/10, pt=a=>fx(a[0])+','+fx(a[1]);

function solve(P){
  const p=[0,0], sw=P.sw||0, hw=P.hw||0;
  const n=go(p,P.t,L.torso), h=go(n,P.hd??P.t,L.neck);
  const A1=P.a1, A2=P.a2||P.a1, L1=P.l1, L2=P.l2||P.l1;
  const s1=[n[0]+sw,n[1]], s2=[n[0]-sw,n[1]], hp1=[hw,0], hp2=[-hw,0];
  const ua=P.ua??L.ua, fa=P.fa??L.fa, th=P.thl??L.th;
  const e1=go(s1,A1[0],ua), w1=go(e1,A1[1],fa), e2=go(s2,A2[0],ua), w2=go(e2,A2[1],fa);
  const k1=go(hp1,L1[0],th), a1=go(k1,L1[1],L.sh), t1=go(a1,L1[2]??0,L.foot);
  const k2=go(hp2,L2[0],th), a2=go(k2,L2[1],L.sh), t2=go(a2,L2[2]??0,L.foot);
  return {p,n,h,s1,s2,hp1,hp2,e1,w1,e2,w2,k1,a1,t1,k2,a2,t2};
}
function shift(J,dx,dy){for(const k in J)J[k]=[J[k][0]+dx,J[k][1]+dy];}
function bbox(J){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const k in J){const r=R[k]??4.5;x0=Math.min(x0,J[k][0]-r);x1=Math.max(x1,J[k][0]+r);y0=Math.min(y0,J[k][1]-r);y1=Math.max(y1,J[k][1]+r);}return[x0,x1,y0,y1];}
function layout(ex){
  const Js=ex.frames.map(P=>{const J=solve(P);
    if(P.view!=='top'){let m=-1e9;for(const k in J)m=Math.max(m,J[k][1]+(R[k]??4.5));shift(J,0,FLOOR-(P.gap||0)-m);}
    return J;});
  const an=ex.anchor||'p';
  Js.forEach(J=>shift(J,Js[0][an][0]-J[an][0],0));
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  Js.forEach(J=>{const b=bbox(J);x0=Math.min(x0,b[0]);x1=Math.max(x1,b[1]);y0=Math.min(y0,b[2]);y1=Math.max(y1,b[3]);});
  const pad=ex.pad||[0,0]; x0-=pad[0]; x1+=pad[1];
  const dx=W/2-(x0+x1)/2, dy=ex.frames[0].view==='top'?62-(y0+y1)/2:0;
  Js.forEach(J=>shift(J,dx,dy));
  return Js;
}
const poly=(ps,c,w)=>`<polyline points="${ps.map(pt).join(' ')}" class="lb ${c}" stroke-width="${w}"/>`;
function figure(J,P){
  const c2=P.front?'fig':'fig2'; let s='';
  s+=poly([J.s2,J.e2,J.w2],c2,7.5)+poly([J.hp2,J.k2,J.a2],c2,8.5)+poly([J.a2,J.t2],c2,5.5);
  if(P.front){s+=`<polygon points="${[J.s2,J.s1,J.hp1,J.hp2].map(pt).join(' ')}" class="lb fig torsoF" stroke-width="12"/>`+poly([J.n,J.h],'fig',8);}
  else if(P.curve){const m=[(J.n[0]+J.p[0])/2,(J.n[1]+J.p[1])/2],d=P.t*RAD,c=[m[0]+Math.sin(d)*P.curve*2,m[1]-Math.cos(d)*P.curve*2];
    s+=`<path d="M${pt(J.p)} Q${pt(c)} ${pt(J.n)}" class="lb fig" stroke-width="15"/>`;}
  else s+=poly([J.p,J.n],'fig',15);
  s+=`<circle cx="${fx(J.h[0])}" cy="${fx(J.h[1])}" r="9.5" class="head"/>`;
  s+=poly([J.hp1,J.k1,J.a1],'fig',9)+poly([J.a1,J.t1],'fig',6)+poly([J.s1,J.e1,J.w1],'fig',8);
  return s;
}
/* props */
const rc=(x,y,w,h,c='eq',r=1.5)=>`<rect x="${fx(x)}" y="${fx(y)}" width="${fx(Math.max(w,0))}" height="${fx(Math.max(h,0))}" rx="${r}" class="${c}"/>`;
const ln=(a,b,c='cb')=>`<line x1="${fx(a[0])}" y1="${fx(a[1])}" x2="${fx(b[0])}" y2="${fx(b[1])}" class="${c}"/>`;
const ci=(p,r,c)=>`<circle cx="${fx(p[0])}" cy="${fx(p[1])}" r="${r}" class="${c}"/>`;
const tx=(x,y,s)=>`<text x="${fx(x)}" y="${fx(y)}" class="lbl" text-anchor="middle">${s}</text>`;
const bench=(x1,x2,top)=>rc(x1,top,x2-x1,6)+rc(x1+4,top+6,4,FLOOR-top-6,'eq',1)+rc(x2-8,top+6,4,FLOOR-top-6,'eq',1);
const db=(p,v)=>v?rc(p[0]-1.5,p[1]-9,3,18,'wt',1)+rc(p[0]-5.5,p[1]-12,11,5,'wt',2)+rc(p[0]-5.5,p[1]+7,11,5,'wt',2)
                 :rc(p[0]-9,p[1]-1.5,18,3,'wt',1)+rc(p[0]-12,p[1]-5.5,5,11,'wt',2)+rc(p[0]+7,p[1]-5.5,5,11,'wt',2);
const mat=J=>{const b=bbox(J);return rc(b[0]-4,FLOOR-3,b[1]-b[0]+8,3,'mat',1.5);};
const pulley=p=>ci(p,4.5,'pul');
const column=x=>rc(x-4,-18,8,FLOOR+18,'eq',2);
const matOnly=J=>({b:mat(J)});

/* poses */
const STAND={t:-90,a1:[90,90],a2:[92,92],l1:[89,90],l2:[92,91]};
const SUP={t:180,a1:[0,0],a2:[1,0],l1:[-51,72],l2:[-49,74]};
const BRIDGE_UP={t:156.6,hd:180,a1:[3,0],a2:[4,0],l1:[-21,90],l2:[-19,92]};
const FOURS={t:-21,hd:-8,a1:[90,90],a2:[91,91],l1:[90,180,180],l2:[91,180,180]};

const BIRDDOG={name:'«Птица-собака»',en:'Bird dog',dose:'40 сек, чередуя стороны',
  how:['Встаньте на четвереньки: ладони под плечами, колени под тазом.','Вытяните вперёд одну руку и назад противоположную ногу на уровне корпуса.','Задержитесь на 2 секунды, вернитесь и смените сторону.'],
  tip:'таз не заваливается вбок, спина ровная, как столешница.',
  frames:[FOURS,{...FOURS,a2:[-3,-3],l1:[182,182,180]}],labels:['исходное','вытянуться'],props:matOnly};
const PLANK={name:'Планка на предплечьях',en:'Plank',dose:'40 сек',
  how:['Локти под плечами, предплечья на полу.','Тело — прямая линия от головы до пяток.','Втяните живот, сожмите ягодицы, дышите ровно.'],
  tip:'поясница не провисает и таз не задирается. Начните с варианта с колен.',
  frames:[{t:-19.2,a1:[90,0],a2:[91,0],l1:[160.8,180,180],l2:[161.8,180,180]},{t:-13.6,a1:[90,0],a2:[91,0],l1:[166.4,166.4,95],l2:[167,167,95]}],
  labels:['легче: с колен','полная'],props:matOnly};
const BRIDGE={name:'Ягодичный мост',en:'Glute bridge',dose:'15 раз',
  how:['Лягте на спину, стопы на полу на ширине таза, руки вдоль тела.','Толкаясь пятками, поднимите таз до прямой линии от плеч до колен.','Сожмите ягодицы на секунду и медленно опуститесь.'],
  tip:'поднимайте таз ягодицами, а не прогибом в пояснице.',
  frames:[SUP,BRIDGE_UP],props:matOnly};
const INCL={t:-35,hd:-28,a1:[90,90],a2:[92,92],l1:[112,98,0],l2:[115,100,0]};
const inclBench=J=>{const d=[Math.cos(-35*RAD),Math.sin(-35*RAD)],nv=[-d[1],d[0]],o=12;
  const A=[J.p[0]+nv[0]*o-d[0]*12,J.p[1]+nv[1]*o-d[1]*12],B=[J.n[0]+nv[0]*o-d[0]*16,J.n[1]+nv[1]*o-d[1]*16],M=[(A[0]+B[0])/2,(A[1]+B[1])/2];
  return{b:ln(M,[M[0],FLOOR-3],'post')+ln(A,[A[0]-3,FLOOR-3],'post')+rc(A[0]-14,FLOOR-4,(M[0]+12)-(A[0]-14),4,'eqd',1)+ln(A,B,'pad')};};
const seatProps=(J,top)=>{const px=J.p[0],py=J.p[1],t=top??J.n[1]-4;
  return rc(px-18,py+7,36,6)+rc(px-21,t,6,py+13-t)+rc(px-3,py+13,6,FLOOR-py-13,'eq',1)+rc(px-24,FLOOR-4,48,4,'eq',1);};

tabsEl.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;show(b.dataset.id);try{history.replaceState(null,'','#'+b.dataset.id)}catch(e){}window.scrollTo({top:0});});
let start=(location.hash||'').slice(1);
if(!start){try{start=localStorage.getItem('atlas-tab')||''}catch(e){}}
show(start||'a');
let picks=new Set(), onlyPicked=false;
try{picks=new Set(JSON.parse(localStorage.getItem('atlas-picks')||'[]'))}catch(e){}
function syncPicks(){
  document.querySelectorAll('.pick').forEach(b=>{const on=picks.has(b.dataset.name),c=b.closest('.card');
    b.setAttribute('aria-pressed',on);b.textContent=on?'✓ В моей тренировке':'+ Добавить в мою тренировку';
    c.classList.toggle('picked',on);c.hidden=onlyPicked&&!on;});
  const n=document.querySelectorAll('.pick[aria-pressed="true"]').length;
  document.getElementById('pcount').textContent=n?`Выбрано: ${n}`:'Пока ничего не выбрано';
  document.getElementById('onlyPicked').setAttribute('aria-pressed',onlyPicked);
  document.getElementById('pempty').hidden=!(onlyPicked&&!n);
  try{localStorage.setItem('atlas-picks',JSON.stringify([...picks]))}catch(e){}
}
main.addEventListener('click',e=>{
  const b=e.target.closest('.pick');
  if(b){const k=b.dataset.name;picks.has(k)?picks.delete(k):picks.add(k);syncPicks();return;}
  if(e.target.closest('#onlyPicked')){onlyPicked=!onlyPicked;syncPicks();}
  if(e.target.closest('#clearPicks')){picks.clear();onlyPicked=false;syncPicks();}
});
syncPicks();
</script>

</body></html>
