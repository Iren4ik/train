<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Атлас упражнений</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: sticky segmented tabs over a 1–2 column grid of exercise cards; each card = two-frame schematic (start → finish) + steps */
:root{
  --bg:#F1F4F2; --card:#FFFFFF; --panel:#F6F8F7; --fg:#1C2428; --muted:#5D696F; --line:#D6DDD9;
  --fig:#1F2B33; --fig2:#A7B2B8; --eq:#8E999E; --eqd:#5E696F; --acc:#2D5AD6; --accsoft:#E4EAFB; --mat:#E2E8E4;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101417; --card:#182024; --panel:#1D262B; --fg:#E6ECEE; --muted:#98A4AA; --line:#2B353A;
  --fig:#E8EEF0; --fig2:#5B676E; --eq:#6E7A80; --eqd:#9CA8AE; --acc:#7E9EFF; --accsoft:#1E2946; --mat:#252E33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101417; --card:#182024; --panel:#1D262B; --fg:#E6ECEE; --muted:#98A4AA; --line:#2B353A;
  --fig:#E8EEF0; --fig2:#5B676E; --eq:#6E7A80; --eqd:#9CA8AE; --acc:#7E9EFF; --accsoft:#1E2946; --mat:#252E33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.wrap{padding-block:28px 14px;display:grid;gap:10px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-top:2px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:22px;height:7px;border-radius:4px;display:inline-block}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:6px;padding-block:10px;overflow-x:auto}
.tab{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 16px;display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap}
.tab b{font-family:var(--display);font-weight:700;font-size:15px}
.tab small{color:var(--muted);font-size:13px}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.75}
.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main.wrap{padding-block:20px 48px}
.intro{display:grid;gap:4px;margin-bottom:18px}
.intro h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0}
.intro p{margin:0;color:var(--muted);max-width:68ch}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:780px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.chead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.num{font-family:var(--display);font-weight:700;font-size:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accsoft);color:var(--acc);font-variant-numeric:tabular-nums}
.chead h3{margin:0;font-size:17px;line-height:1.25;font-weight:700;text-wrap:balance}
.en{margin:2px 0 0;font-size:13px;color:var(--muted)}
.dose{font-size:13px;font-weight:700;white-space:nowrap;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.frames{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px}
.frames.one{grid-template-columns:minmax(0,60%);justify-content:center}
figure{margin:0;display:grid;gap:4px;min-width:0}
figure svg{width:100%;height:auto;display:block;background:var(--panel);border-radius:12px}
figcaption{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.02em}
.arr{color:var(--muted);font-size:18px;padding-bottom:20px}
.how{margin:0;padding-left:20px;display:grid;gap:4px}
.how li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.tip{margin:0;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--accsoft)}
.foot{color:var(--muted);font-size:13px;margin-top:24px;max-width:70ch}
/* svg */
.lb{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig{stroke:var(--fig)} .fig2{stroke:var(--fig2)}
.torsoF{fill:var(--fig)}
.head{fill:var(--fig)}
.floor{stroke:var(--line);stroke-width:1.5}
.eq{fill:var(--eq)} .eqd{fill:var(--eqd)} .mat{fill:var(--mat)} .wall{fill:var(--mat)}
.cb{stroke:var(--eqd);stroke-width:1.4} .dash{stroke-dasharray:3 3}
.bar{stroke:var(--eqd);stroke-width:3.5;stroke-linecap:round}
.post{stroke:var(--eqd);stroke-width:4;stroke-linecap:round}
.pul{fill:var(--panel);stroke:var(--eqd);stroke-width:2}
.wt{fill:var(--acc)} .plate{fill:var(--acc);fill-opacity:.9} .hub{fill:var(--panel)}
.hl{fill:var(--acc);fill-opacity:.22;stroke:var(--acc);stroke-width:1.5}
.lbl{fill:var(--muted);font-size:10px;font-family:var(--body)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>

<header class="wrap">
  <h1>Атлас упражнений</h1>
  <p class="lead">Схемы к плану тренировок: слева исходное положение, справа конечное. Названия в скобках — как упражнение обычно называют в зале.</p>
  <div class="legend">
    <span><i class="sw" style="background:var(--fig)"></i>ближние рука и нога</span>
    <span><i class="sw" style="background:var(--fig2)"></i>дальние рука и нога</span>
    <span><i class="sw" style="background:var(--acc)"></i>вес</span>
    <span><i class="sw" style="background:var(--eq)"></i>тренажёр, скамья, трос</span>
  </div>
</header>
<nav class="tabs" aria-label="Тренировки"><div class="wrap tabrow" role="tablist" id="tabs"></div></nav>
<main class="wrap" id="main"></main>

<script>
const FLOOR=150, W=220, VBY=-22, VBH=184;
const L={torso:42,neck:13,ua:24,fa:22,th:31,sh:29,foot:8};
const R={h:8.5,n:7.5,p:7.5,s1:7.5,s2:7.5,hp1:7.5,hp2:7.5,t1:2.5,t2:2.5};
const RAD=Math.PI/180;
const go=(o,a,l)=>[o[0]+Math.cos(a*RAD)*l,o[1]+Math.sin(a*RAD)*l];
const fx=v=>Math.round(v*10)/10, pt=a=>fx(a[0])+','+fx(a[1]);

function solve(P){
  const p=[0,0], sw=P.sw||0, hw=P.hw||0;
  const n=go(p,P.t,L.torso), h=go(n,P.hd??P.t,L.neck);
  const A1=P.a1, A2=P.a2||P.a1, L1=P.l1, L2=P.l2||P.l1;
  const s1=[n[0]+sw,n[1]], s2=[n[0]-sw,n[1]], hp1=[hw,0], hp2=[-hw,0];
  const e1=go(s1,A1[0],L.ua), w1=go(e1,A1[1],L.fa), e2=go(s2,A2[0],L.ua), w2=go(e2,A2[1],L.fa);
  const k1=go(hp1,L1[0],L.th), a1=go(k1,L1[1],L.sh), t1=go(a1,L1[2]??0,L.foot);
  const k2=go(hp2,L2[0],L.th), a2=go(k2,L2[1],L.sh), t2=go(a2,L2[2]??0,L.foot);
  return {p,n,h,s1,s2,hp1,hp2,e1,w1,e2,w2,k1,a1,t1,k2,a2,t2};
}
function shift(J,dx,dy){for(const k in J)J[k]=[J[k][0]+dx,J[k][1]+dy];}
function bbox(J){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const k in J){const r=R[k]??4.5;x0=Math.min(x0,J[k][0]-r);x1=Math.max(x1,J[k][0]+r);y0=Math.min(y0,J[k][1]-r);y1=Math.max(y1,J[k][1]+r);}return[x0,x1,y0,y1];}
function layout(ex){
  const Js=ex.frames.map(P=>{const J=solve(P);
    if(P.view!=='top'){let m=-1e9;for(const k in J)m=Math.max(m,J[k][1]+(R[k]??4.5));shift(J,0,FLOOR-(P.gap||0)-m);}
    return J;});
  const an=ex.anchor||'p';
  Js.forEach(J=>shift(J,Js[0][an][0]-J[an][0],0));
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  Js.forEach(J=>{const b=bbox(J);x0=Math.min(x0,b[0]);x1=Math.max(x1,b[1]);y0=Math.min(y0,b[2]);y1=Math.max(y1,b[3]);});
  const pad=ex.pad||[0,0]; x0-=pad[0]; x1+=pad[1];
  const dx=W/2-(x0+x1)/2, dy=ex.frames[0].view==='top'?62-(y0+y1)/2:0;
  Js.forEach(J=>shift(J,dx,dy));
  return Js;
}
const poly=(ps,c,w)=>`<polyline points="${ps.map(pt).join(' ')}" class="lb ${c}" stroke-width="${w}"/>`;
function figure(J,P){
  const c2=P.front?'fig':'fig2'; let s='';
  s+=poly([J.s2,J.e2,J.w2],c2,7.5)+poly([J.hp2,J.k2,J.a2],c2,8.5)+poly([J.a2,J.t2],c2,5.5);
  if(P.front){s+=`<polygon points="${[J.s2,J.s1,J.hp1,J.hp2].map(pt).join(' ')}" class="lb fig torsoF" stroke-width="12"/>`+poly([J.n,J.h],'fig',8);}
  else if(P.curve){const m=[(J.n[0]+J.p[0])/2,(J.n[1]+J.p[1])/2],d=P.t*RAD,c=[m[0]+Math.sin(d)*P.curve*2,m[1]-Math.cos(d)*P.curve*2];
    s+=`<path d="M${pt(J.p)} Q${pt(c)} ${pt(J.n)}" class="lb fig" stroke-width="15"/>`;}
  else s+=poly([J.p,J.n],'fig',15);
  s+=`<circle cx="${fx(J.h[0])}" cy="${fx(J.h[1])}" r="9.5" class="head"/>`;
  s+=poly([J.hp1,J.k1,J.a1],'fig',9)+poly([J.a1,J.t1],'fig',6)+poly([J.s1,J.e1,J.w1],'fig',8);
  return s;
}
/* props */
const rc=(x,y,w,h,c='eq',r=1.5)=>`<rect x="${fx(x)}" y="${fx(y)}" width="${fx(Math.max(w,0))}" height="${fx(Math.max(h,0))}" rx="${r}" class="${c}"/>`;
const ln=(a,b,c='cb')=>`<line x1="${fx(a[0])}" y1="${fx(a[1])}" x2="${fx(b[0])}" y2="${fx(b[1])}" class="${c}"/>`;
const ci=(p,r,c)=>`<circle cx="${fx(p[0])}" cy="${fx(p[1])}" r="${r}" class="${c}"/>`;
const tx=(x,y,s)=>`<text x="${fx(x)}" y="${fx(y)}" class="lbl" text-anchor="middle">${s}</text>`;
const bench=(x1,x2,top)=>rc(x1,top,x2-x1,6)+rc(x1+4,top+6,4,FLOOR-top-6,'eq',1)+rc(x2-8,top+6,4,FLOOR-top-6,'eq',1);
const db=(p,v)=>v?rc(p[0]-1.5,p[1]-9,3,18,'wt',1)+rc(p[0]-5.5,p[1]-12,11,5,'wt',2)+rc(p[0]-5.5,p[1]+7,11,5,'wt',2)
                 :rc(p[0]-9,p[1]-1.5,18,3,'wt',1)+rc(p[0]-12,p[1]-5.5,5,11,'wt',2)+rc(p[0]+7,p[1]-5.5,5,11,'wt',2);
const mat=J=>{const b=bbox(J);return rc(b[0]-4,FLOOR-3,b[1]-b[0]+8,3,'mat',1.5);};
const pulley=p=>ci(p,4.5,'pul');
const column=x=>rc(x-4,-18,8,FLOOR+18,'eq',2);
const matOnly=J=>({b:mat(J)});

/* poses */
const STAND={t:-90,a1:[90,90],a2:[92,92],l1:[89,90],l2:[92,91]};
const SUP={t:180,a1:[0,0],a2:[1,0],l1:[-51,72],l2:[-49,74]};
const BRIDGE_UP={t:156.6,hd:180,a1:[3,0],a2:[4,0],l1:[-21,90],l2:[-19,92]};
const FOURS={t:-21,hd:-8,a1:[90,90],a2:[91,91],l1:[90,180,180],l2:[91,180,180]};

const BIRDDOG={name:'«Птица-собака»',en:'Bird dog',dose:'40 сек, чередуя стороны',
  how:['Встаньте на четвереньки: ладони под плечами, колени под тазом.','Вытяните вперёд одну руку и назад противоположную ногу на уровне корпуса.','Задержитесь на 2 секунды, вернитесь и смените сторону.'],
  tip:'таз не заваливается вбок, спина ровная, как столешница.',
  frames:[FOURS,{...FOURS,a2:[-3,-3],l1:[182,182,180]}],labels:['исходное','вытянуться'],props:matOnly};
const PLANK={name:'Планка на предплечьях',en:'Plank',dose:'40 сек',
  how:['Локти под плечами, предплечья на полу.','Тело — прямая линия от головы до пяток.','Втяните живот, сожмите ягодицы, дышите ровно.'],
  tip:'поясница не провисает и таз не задирается. Начните с варианта с колен.',
  frames:[{t:-19.2,a1:[90,0],a2:[91,0],l1:[160.8,180,180],l2:[161.8,180,180]},{t:-13.6,a1:[90,0],a2:[91,0],l1:[166.4,166.4,95],l2:[167,167,95]}],
  labels:['легче: с колен','полная'],props:matOnly};
const BRIDGE={name:'Ягодичный мост',en:'Glute bridge',dose:'15 раз',
  how:['Лягте на спину, стопы на полу на ширине таза, руки вдоль тела.','Толкаясь пятками, поднимите таз до прямой линии от плеч до колен.','Сожмите ягодицы на секунду и медленно опуститесь.'],
  tip:'поднимайте таз ягодицами, а не прогибом в пояснице.',
  frames:[SUP,BRIDGE_UP],props:matOnly};

const TABS=[
{id:'a',label:'А',sub:'спина + ноги',title:'Тренировка А',
 intro:'Перед началом 8–10 минут разминки: дорожка, «кошка-корова», ягодичный мост. Отдых между подходами 60–90 секунд.',
 items:[
 {name:'Тяга верхнего блока к груди',en:'Lat pulldown',dose:'3 × 10–12',
  how:['Сядьте, зафиксируйте бёдра под валиком, возьмитесь за рукоять чуть шире плеч.','Слегка отклонитесь назад и тяните рукоять к верхней части груди, опуская лопатки вниз.','Медленно верните руки вверх.'],
  tip:'не тяните за голову и не раскачивайтесь корпусом.',
  frames:[{t:-100,a1:[-80,-85],a2:[-76,-82],l1:[0,90],l2:[2,92]},{t:-100,a1:[110,-60],a2:[106,-58],l1:[0,90],l2:[2,92]}],pad:[30,0],
  props:J=>{const px=J.p[0],py=J.p[1],T=-16;
   return{b:column(px-40)+rc(px-40,T-3,44,6,'eq',2)+rc(px-20,py+7,36,6)+rc(px-3,py+13,6,FLOOR-py-13,'eq',1)+rc(px-26,FLOOR-4,52,4,'eq',1)+rc(J.k1[0]-13,J.k1[1]-15,15,8,'eqd',4),
    f:ln([px,T],J.w1)+pulley([px,T])+ln([J.w1[0]-15,J.w1[1]],[J.w1[0]+12,J.w1[1]],'bar')};}},
 {name:'Тяга горизонтального блока',en:'Seated cable row',dose:'3 × 10–12',
  how:['Сядьте, упритесь стопами в платформу, колени слегка согнуты.','С прямой спиной тяните рукоять к низу живота, отводя локти назад вдоль тела.','Сведите лопатки, затем плавно выпрямите руки.'],
  tip:'спина не округляется, корпус почти неподвижен.',
  frames:[{t:-80,a1:[8,4],a2:[10,6],l1:[-15,15,-90],l2:[-13,17,-88],gap:20},{t:-97,a1:[150,0],a2:[146,2],l1:[-15,15,-90],l2:[-13,17,-88],gap:20}],
  anchor:'a1',pad:[0,34],
  props:J=>{const a=J.a1,p=J.p,sy=FLOOR-20,pl=[a[0]+24,a[1]-6];
   return{b:rc(p[0]-32,sy,(a[0]-2)-(p[0]-32),6)+rc(p[0]-28,sy+6,4,14,'eq',1)+rc(a[0]-12,sy+6,4,14,'eq',1)+rc(a[0]+5,a[1]-16,5,24,'eqd',1.5)+column(a[0]+28),
    f:ln(pl,J.w1)+pulley(pl)+ln([J.w1[0],J.w1[1]-6],[J.w1[0],J.w1[1]+6],'bar')};}},
 {name:'Гоблет-присед',en:'Goblet squat — присед с гантелью у груди',dose:'3 × 10–12',
  how:['Держите гантель вертикально у груди двумя руками, стопы чуть шире плеч.','Отводите таз назад и вниз, как будто садитесь на стул. Колени смотрят туда же, куда носки.','Опуститесь до параллели бёдер с полом или насколько комфортно и встаньте, толкаясь пятками.'],
  tip:'пятки не отрываются от пола, спина прямая.',
  frames:[{...STAND,a1:[80,-60],a2:[82,-58]},{t:-62,a1:[60,-70],a2:[62,-68],l1:[10,105],l2:[12,107]}],anchor:'a1',
  props:J=>({f:db(J.w1,true)})},
 {name:'Румынская тяга с гантелями',en:'Romanian deadlift',dose:'3 × 10–12',
  how:['Встаньте прямо, гантели перед бёдрами, колени чуть согнуты.','Отводите таз назад и наклоняйтесь с прямой спиной, гантели скользят вдоль ног.','Когда почувствуете натяжение задней поверхности бедра, вернитесь, сжимая ягодицы.'],
  tip:'это наклон за счёт таза, а не приседание. Спина не округляется.',
  frames:[{...STAND,a1:[92,92]},{t:-40,a1:[100,100],a2:[98,98],l1:[60,85],l2:[62,86]}],anchor:'a1',
  props:J=>({f:db(J.w1)})},
 {name:'Жим гантелей сидя',en:'Seated dumbbell press',dose:'3 × 10',
  how:['Сядьте на скамью со спинкой, гантели у плеч, локти чуть впереди корпуса.','Выжмите гантели вверх над головой.','Медленно опустите обратно к плечам.'],
  tip:'не прогибайтесь в пояснице — спина прижата к спинке.',
  frames:[{t:-90,a1:[70,-90],a2:[74,-92],l1:[0,90],l2:[2,92]},{t:-90,a1:[-88,-90],a2:[-92,-90],l1:[0,90],l2:[2,92]}],
  props:J=>{const px=J.p[0],py=J.p[1];

function frameSVG(ex,J,i,label){
  const P=ex.frames[i], pr=ex.props?ex.props(J,i):{};
  const floor=(P.view==='top'||ex.noFloor)?'':`<line x1="0" y1="${FLOOR}" x2="${W}" y2="${FLOOR}" class="floor"/>`;
  let inner=(pr.b||'')+figure(J,P)+(pr.f||'');
  if(ex.rot) inner=`<g transform="rotate(${ex.rot} ${W/2} ${FLOOR})">${inner}</g>`;
  return `<figure><svg viewBox="0 ${VBY} ${W} ${VBH}" role="img" aria-label="${ex.name}: ${label}">${floor}${inner}</svg><figcaption>${label}</figcaption></figure>`;
}
function card(ex,idx){
  const Js=layout(ex), labels=ex.labels||['старт','финиш'];
  const fr=Js.map((J,i)=>frameSVG(ex,J,i,labels[i]));
  const frames=fr.length>1?`<div class="frames">${fr[0]}<span class="arr" aria-hidden="true">→</span>${fr[1]}</div>`:`<div class="frames one">${fr[0]}</div>`;
  return `<article class="card"><div class="chead"><span class="num">${idx+1}</span><div><h3>${ex.name}</h3><p class="en">${ex.en}</p></div><span class="dose">${ex.dose}</span></div>${frames}<ol class="how">${ex.how.map(s=>`<li>${s}</li>`).join('')}</ol><p class="tip"><b>Важно:</b> ${ex.tip}</p></article>`;
}
const tabsEl=document.getElementById('tabs'), main=document.getElementById('main');
tabsEl.innerHTML=TABS.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" aria-controls="sec-${t.id}" data-id="${t.id}"><b>${t.label}</b><small>${t.sub}</small></button>`).join('');
main.innerHTML=TABS.map(t=>`<section id="sec-${t.id}" role="tabpanel" aria-labelledby="tab-${t.id}"><div class="intro"><h2>${t.title}</h2><p>${t.intro}</p></div><div class="grid">${t.items.map(card).join('')}</div></section>`).join('')
 +`<p class="foot">Схемы условные и показывают общую траекторию движения. На первых занятиях попросите тренера в зале поставить технику, особенно в румынской тяге и ягодичном мосте со штангой.</p>`;
function show(id){
  if(!TABS.some(t=>t.id===id)) id='a';
  TABS.forEach(t=>{document.getElementById('sec-'+t.id).hidden=t.id!==id;document.getElementById('tab-'+t.id).setAttribute('aria-selected',t.id===id);});
  try{localStorage.setItem('atlas-tab',id)}catch(e){}
}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;show(b.dataset.id);try{history.replaceState(null,'','#'+b.dataset.id)}catch(e){}window.scrollTo({top:0});});
let start=(location.hash||'').slice(1);
if(!start){try{start=localStorage.getItem('atlas-tab')||''}catch(e){}}
show(start||'a');
</script>
